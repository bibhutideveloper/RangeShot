<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RangeShot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <h1>RangeShot</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
    </header>

    <!-- Content / Actions -->
    <main class="main-content">
      <p class="description">
        Capture long webpage screenshots between custom <strong>START</strong> and <strong>END</strong> points.
      </p>

      <div class="action-buttons">
        <button id="captureRangeBtn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
            <line x1="5" y1="21" x2="19" y2="21"></line>
          </svg>
          <span>Capture Range</span>
        </button>

        <button id="captureFullBtn" class="btn btn-secondary" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <span>Capture Full Page</span>
          <span class="badge">Coming Soon</span>
        </button>
      </div>

      <div id="statusArea" class="status-area">
        <div class="step-guide">
          <div class="step"><span class="step-num">1</span> Click START point</div>
          <div class="step"><span class="step-num">2</span> Scroll & click END point</div>
          <div class="step"><span class="step-num">3</span> Confirm & download PNG</div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Local-first • Zero external telemetry</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
